name: Release

# Tags and publishes a GitHub release when the plugin version on main has no
# tag yet. Runs on GitHub, so cloud agent sessions (which cannot push tags)
# only need to merge the version bump.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          version=$(python3 -c 'import json; print(json.load(open(".claude-plugin/plugin.json"))["version"])')
          tag="v${version}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${tag} already exists; nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag the version bump commit
        if: steps.version.outputs.exists == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Tag the commit that last changed the manifest (the release commit),
          # not whatever happens to be on main when this runs.
          sha=$(git log -1 --format=%H -- .claude-plugin/plugin.json)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" "${sha}" -m "${TAG}"
          git push origin "${TAG}"

      - name: Publish release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Notes come from the matching CHANGELOG section ("## vX.Y.Z — date").
          awk -v tag="${TAG}" '
            /^## / { if (found) exit; if ($2 == tag) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            gh release create "${TAG}" --title "${TAG}" --notes-file notes.md --verify-tag
          else
            gh release create "${TAG}" --title "${TAG}" --generate-notes --verify-tag
          fi
