name: Delete merged branch

# Deletes a PR's head branch after it merges. Cloud agent sessions cannot
# delete branches, so this does it on GitHub instead.

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write

jobs:
  delete-branch:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest

    steps:
      - name: Delete head branch
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.event.pull_request.head.ref }}
        run: |
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${REF}" \
            || echo "Branch ${REF} already gone."
